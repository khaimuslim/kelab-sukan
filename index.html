<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Ahli Persatuan Kebajikan</title>
    <!-- Tailwind CSS Standard (Versi Stabil) -->
    <script src="https://jsdelivr.net"></script>
    <!-- FontAwesome Ikon -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- SheetJS Excel -->
    <script src="https://cloudflare.com"></script>
    <!-- jsPDF Laporan -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen">

    <!-- Header Biru Profesional -->
    <header class="bg-blue-700 text-white shadow-md w-full">
        <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="p-3 bg-white/20 rounded-full text-2xl">
                    🤝
                </div>
                <div>
                    <input type="text" id="associationName" value="Persatuan Kebajikan Komuniti Prihatin" class="bg-transparent border-b border-transparent hover:border-white focus:border-white focus:outline-none text-xl md:text-2xl font-bold w-full transition-all">
                    <input type="text" id="associationDesc" value="Pendaftaran No: PPM-015-10-2026 | Ditubuhkan: 2026" class="bg-transparent border-b border-transparent hover:border-white focus:border-white focus:outline-none text-xs text-blue-100 w-full transition-all">
                </div>
            </div>
            <div class="text-right">
                <span class="bg-blue-800 px-4 py-2 rounded-lg font-semibold text-sm border border-blue-500 inline-block">
                    💰 Yuran Wajib: RM10.00 / Setahun
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Dashboard Statistik Ringkas -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500 flex justify-between items-center">
                <div>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider">Ahli Aktif</p>
                    <p class="text-3xl font-bold text-slate-900 mt-1" id="statActive">0</p>
                </div>
                <div class="text-green-500 text-2xl font-bold">✓</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500 flex justify-between items-center">
                <div>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider">Ahli Tidak Aktif</p>
                    <p class="text-3xl font-bold text-slate-900 mt-1" id="statInactive">0</p>
                </div>
                <div class="text-red-500 text-2xl font-bold">✗</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500 flex justify-between items-center">
                <div>
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider">Jumlah Kutipan</p>
                    <p class="text-3xl font-bold text-slate-900 mt-1" id="statTotalFunds">RM 0.00</p>
                </div>
                <div class="text-blue-500 text-2xl font-bold">💵</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Bahagian Kiri: Borang Pendaftaran & QR -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                        📝 Daftar / Kemas Kini Ahli
                    </h2>
                    <form id="memberForm" class="space-y-4">
                        <input type="hidden" id="memberId">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Nama Penuh</label>
                            <input type="text" id="fullName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Nombor IC (Tanpa -)</label>
                            <input type="text" id="icNumber" required placeholder="Contoh: 850215145566" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">No. Telefon (WhatsApp)</label>
                            <input type="text" id="phone" required placeholder="Contoh: 60123456789" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Tarikh Bayar</label>
                                <input type="date" id="payDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">Kaedah Bayaran</label>
                                <select id="payMethod" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
                                    <option value="Tunai">Tunai</option>
                                    <option value="Online Banking">Online Banking</option>
                                    <option value="QR Code">QR Code</option>
                                    <option value="Belum Bayar">Belum Bayar</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm transition-colors cursor-pointer shadow-sm">
                            Simpan Rekod Ahli
                        </button>
                    </form>
                </div>

                <!-- QR Code Box -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center">
                    <h3 class="text-sm font-bold text-slate-900 mb-1">📷 QR Code Pembayaran Persatuan</h3>
                    <p class="text-xs text-slate-500 mb-4">Imbas untuk bayaran yuran RM10/tahun</p>
                    <div class="border-2 border-dashed border-slate-200 rounded-lg p-6 bg-slate-50 flex flex-col items-center justify-center min-h-[150px]">
                        <span class="text-3xl mb-2">🖼️</span>
                        <p class="text-xs text-slate-400 font-medium">Ruangan QR Code Bank Persatuan</p>
                    </div>
                </div>
            </div>

            <!-- Bahagian Kanan: Carian & Jadual Ahli -->
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex flex-col sm:flex-row gap-4 justify-between items-center mb-6">
                        <div class="w-full sm:w-72">
                            <input type="text" id="searchIC" oninput="filterMembers()" placeholder="🔍 Cari menggunakan No. IC..." class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto">
                            <button onclick="exportToExcel()" class="flex-1 sm:flex-initial bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition-colors cursor-pointer">
                                📥 Excel
                            </button>
                            <button onclick="exportToPDF()" class="flex-1 sm:flex-initial bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition-colors cursor-pointer">
                                📄 PDF
                            </button>
                        </div>
                    </div>

                    <!-- Jadual Senarai Ahli -->
                    <div class="overflow-x-auto w-full">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold">
                                    <th class="p-3">Nama / IC</th>
                                    <th class="p-3">Status</th>
                                    <th class="p-3">Tarikh & Kaedah</th>
                                    <th class="p-3 text-center">Tindakan</th>
                                </tr>
                            </thead>
                            <tbody id="memberTableBody">
                                <!-- JavaScript Data Load -->
                            </tbody>
                        </table>
                    </div>
